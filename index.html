<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171d22"><title>目玉焼き職人 | PERFECT SUNNY SIDE</title><style>*{box-sizing:border-box}body{margin:0;background:#11191e;color:#f6efe1;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}main{max-width:560px;margin:auto;padding:15px 14px 30px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;letter-spacing:3px;color:#f8c56c}.pill{font-size:12px;background:#2b3439;padding:7px 11px;border-radius:20px}h1{font-size:28px;margin:7px 0 4px}.sub{font-size:13px;color:#aeb6b7;margin:0 0 12px}.scene{position:relative;background:#242d31;border:1px solid #536064;border-radius:18px;overflow:hidden;box-shadow:0 15px 35px #0006}canvas{width:100%;display:block;touch-action:none}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}.stat{background:#252f33;border-radius:12px;padding:9px;text-align:center}.stat small{display:block;color:#9baeb2;font-size:10px}.stat b{font-size:18px}.bar{height:7px;background:#455057;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#f3bb66;width:0%;transition:width .2s}.panel{background:#252f33;border:1px solid #39484d;border-radius:15px;padding:13px;margin-top:10px}.panel h2{font-size:15px;margin:0 0 7px}.tip{font-size:12px;color:#c2cdd0;min-height:34px;margin:5px 0 10px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:1px solid #536066;border-radius:12px;background:#38464b;color:white;min-height:55px;font-size:13px;font-weight:700;padding:8px 4px;cursor:pointer;user-select:none;-webkit-user-select:none}.btn:active{transform:scale(.97);background:#596b6d}.btn strong{display:block;font-size:18px}.btn.primary{background:#eab767;color:#292018;border:0}.btn.active{background:#a75b42}.btn:disabled{opacity:.36}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.overlay{position:absolute;inset:0;background:#0b151bdc;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center}.overlay.hide{display:none}.modal{max-width:360px}.modal h2{font-size:28px;margin:0 0 12px}.modal p{font-size:14px;line-height:1.8;color:#d5dcdb}.score{font-size:64px;font-weight:900;color:#f8c46b;line-height:1.1}.grades{font-size:13px;line-height:1.9;text-align:left;background:#243138;border-radius:10px;padding:12px;margin:10px 0}.note{font-size:11px;color:#95a6a8;margin-top:12px}#message{color:#f8c46b;font-size:13px;min-height:20px;margin:7px 0}#finish{display:none}</style></head><body><main><div class="top"><span class="brand">KITCHEN ARCADE</span><span class="pill">🍳 目玉焼き職人</span></div><h1>PERFECT EGG</h1><p class="sub">油、火加減、味付け、フライパン操作。最後の一投までが料理です。</p><div class="scene"><canvas id="cv" width="520" height="425"></canvas><div id="overlay" class="overlay"><div class="modal" id="intro"><div style="font-size:54px">🍳</div><h2>最高の目玉焼きを。</h2><p>油をひいて卵を割り、火加減を調整。塩・コショウ・ソースで味を決めたら、フライパンを揺すって仕上げます。最後はお皿にフリップ！</p><button class="btn primary" style="width:100%" id="start">調理スタート</button></div><div class="modal" id="finish"></div></div></div><div class="hud"><div class="stat"><small>焼き加減</small><b id="cook">0%</b><div class="bar"><i id="cookbar"></i></div></div><div class="stat"><small>火力</small><b id="heat">中火</b><div class="bar"><i id="heatbar" style="width:50%"></i></div></div><div class="stat"><small>経過時間</small><b id="time">0.0s</b><div class="bar"><i id="timebar"></i></div></div></div><div class="panel"><div class="row"><h2 id="phase">準備</h2><span class="pill" id="step">STEP 1 / 3</span></div><div class="tip" id="tip">まず油をひいて卵を割りましょう。</div><div id="message"></div><div class="controls" id="controls"><button class="btn" id="oil"><strong>🫒</strong>油を注ぐ</button><button class="btn" id="egg"><strong>🥚</strong>卵を割る</button><button class="btn" id="low"><strong>🔥</strong>弱火</button><button class="btn" id="medium"><strong>🔥🔥</strong>中火</button><button class="btn" id="high"><strong>🔥🔥🔥</strong>強火</button><button class="btn" id="salt"><strong>🧂</strong>塩</button><button class="btn" id="pepper"><strong>⚫</strong>コショウ</button><button class="btn" id="sauce"><strong>🟤</strong>ソース</button><button class="btn" id="shake"><strong>↔️</strong>揺する</button><button class="btn primary full" id="plate">🍽️ お皿へフリップ！</button></div><p class="note">ヒント：油は1〜2回、塩・コショウは少量。焼き加減80〜90%を狙いましょう。フリップ時は動くお皿を狙ってタップ！</p></div></main><script>
(()=>{const $=id=>document.getElementById(id),canvas=$('cv'),ctx=canvas.getContext('2d');let game,frame=0,last=0,plateX=260,plateDir=1,eggX=260,eggY=212,flight=0,aim=260,landed=false;function reset(){game={started:false,phase:0,oil:0,egg:false,heat:1,cook:0,time:0,salt:0,pepper:0,sauce:0,shakes:0,shakeOffset:0,shakeVelocity:0,burn:0,plateAccuracy:0,done:false};plateX=260;plateDir=1;flight=0;landed=false;eggX=260;eggY=212;update()}const names=['弱火','中火','強火'];function msg(t){$('message').textContent=t}function update(){let g=game;$('cook').textContent=Math.round(g.cook)+'%';$('cookbar').style.width=Math.min(100,g.cook)+'%';$('heat').textContent=names[g.heat];$('heatbar').style.width=[22,55,100][g.heat]+'%';$('time').textContent=g.time.toFixed(1)+'s';$('timebar').style.width=Math.min(100,g.time/70*100)+'%';$('phase').textContent=g.phase===0?'01 / 下準備':g.phase===1?'02 / 焼く・味付け':g.phase===2?'03 / お皿に着地':'完成';$('step').textContent='STEP '+Math.min(3,g.phase+1)+' / 3';$('tip').textContent=g.phase===0?'油を注いでから卵を割ります。油は入れすぎ注意。':g.phase===1?'火加減・味付け・揺すりを調整。焼きすぎる前にお皿へ！':g.phase===2?'お皿が中央に来るタイミングで、画面または「着地！」をタップ。':'評価を確認してください。';['oil','egg'].forEach(id=>$(id).disabled=g.phase!==0);['low','medium','high','salt','pepper','sauce','shake'].forEach(id=>$(id).disabled=g.phase!==1);$('plate').disabled=g.phase===0||g.done;$('plate').textContent=g.phase===2?'🎯 今だ！ 着地させる':'🍽️ お皿へフリップ！';['low','medium','high'].forEach((id,i)=>$(id).classList.toggle('active',g.phase===1&&g.heat===i))}function score(){let g=game;const oil=Math.max(0,15-Math.abs(g.oil-1.5)*12),cook=Math.max(0,30-Math.abs(g.cook-85)*1.05-g.burn*.12),season=Math.max(0,20-Math.abs(g.salt-1)*5-Math.abs(g.pepper-1)*5-Math.abs(g.sauce-1)*6),shake=Math.min(15,g.shakes*3.75),landing=Math.round(g.plateAccuracy*20),total=Math.round(Math.max(0,Math.min(100,oil+cook+season+shake+landing)));return {oil:Math.round(oil),cook:Math.round(cook),season:Math.round(season),shake:Math.round(shake),landing,total}}function finish(){game.done=true;game.phase=3;const s=score(),grade=s.total>=90?'S':s.total>=75?'A':s.total>=60?'B':s.total>=40?'C':'D';$('finish').style.display='block';$('intro').style.display='none';$('finish').innerHTML='<div style="font-size:12px;letter-spacing:3px;color:#d4bc8d">COOKING RESULT</div><h2>調理終了！</h2><div class="score">'+s.total+'<span style="font-size:22px"> / 100</span></div><h2>ランク '+grade+'</h2><div class="grades">油の量　'+s.oil+' / 15<br>焼き加減　'+s.cook+' / 30<br>味付け　'+s.season+' / 20<br>フライパン操作　'+s.shake+' / 15<br>お皿への着地　'+s.landing+' / 20</div><p>'+(s.total>=90?'完璧な目玉焼き。厨房の伝説です。':s.total>=75?'かなり上出来。あと少しで職人級です。':s.total>=60?'まずまず。焼き加減と着地を磨きましょう。':'もう一度挑戦。料理は練習あるのみ。')+'</p><button class="btn primary" style="width:100%" id="again">もう一度作る</button><button class="btn" style="width:100%;margin-top:8px" id="share">結果をXで共有</button>';$('overlay').classList.remove('hide');$('again').onclick=()=>{reset();$('finish').style.display='none';$('intro').style.display='block';$('overlay').classList.remove('hide')};$('share').onclick=()=>{let t='🍳 目玉焼き職人で '+s.total+'点（ランク'+grade+'）を獲得！\nあなたも挑戦してみてください。';let u='https://twitter.com/intent/tweet?text='+encodeURIComponent(t)+'&url='+encodeURIComponent(location.href);window.open(u,'_blank','noopener')}}$('start').onclick=()=>{game.started=true;last=performance.now();$('overlay').classList.add('hide');msg('油をひいてください。')};$('oil').onclick=()=>{game.oil+=.5;msg('油を '+game.oil.toFixed(1)+' 杯入れました。');update()};$('egg').onclick=()=>{if(game.oil===0){msg('先に油を入れましょう！');return}game.egg=true;game.phase=1;msg('ジュワッ！ 焼き始めました。');update()};['low','medium','high'].forEach((id,i)=>$(id).onclick=()=>{game.heat=i;msg(names[i]+'にしました。');update()});['salt','pepper','sauce'].forEach((id)=>$(id).onclick=()=>{game[id]+=.5;msg(({salt:'塩',pepper:'コショウ',sauce:'ソース'})[id]+'をかけました。');update()});$('shake').onclick=()=>{game.shakes++;game.shakeVelocity=game.shakes%2?17:-17;msg('フライパンを揺すりました！');update()};$('plate').onclick=()=>{if(game.phase===1){game.phase=2;msg('お皿を狙って！ 動くお皿が中央に来たらタップ。')}else if(game.phase===2){land()}update()};function land(){if(game.done||flight)return;flight=0.001;aim=plateX;game.plateAccuracy=Math.max(0,1-Math.abs(plateX-260)/155);msg('フリップ！')}canvas.addEventListener('pointerdown',()=>{if(game.phase===2)land()});function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function draw(t){let g=game;ctx.clearRect(0,0,520,425);let grad=ctx.createLinearGradient(0,0,0,425);grad.addColorStop(0,'#38434a');grad.addColorStop(1,'#20292e');ctx.fillStyle=grad;ctx.fillRect(0,0,520,425);ctx.fillStyle='#4a555a';ctx.fillRect(0,0,520,76);ctx.fillStyle='#30383d';ctx.fillRect(0,76,520,13);for(let i=0;i<6;i++){ctx.fillStyle='#647077';ctx.fillRect(i*100,80,2,8)}ctx.fillStyle='#151d21';ctx.fillRect(0,345,520,80);ctx.fillStyle='#6e7a7e';ctx.fillRect(0,335,520,10);ctx.font='bold 15px system-ui';ctx.fillStyle='#f6d3a0';ctx.fillText(g.phase===2?'FINAL FLIP — TAP TO LAND':'MIDNIGHT KITCHEN / EGG STATION',18,33);ctx.font='12px system-ui';ctx.fillStyle='#c5d2d2';ctx.fillText(g.phase===2?'お皿が中心に来た瞬間を狙おう':g.phase===0?'まずは油を注いでください':g.phase===1?'目標：焼き加減 85%':'',18,54);let off=g.shakeOffset;if(g.phase!==2&&g.phase!==3){ctx.save();ctx.translate(off,0);ctx.fillStyle='#16191b';ctx.beginPath();ctx.roundRect(344,208,185,32,13);ctx.fill();ctx.fillStyle='#40494e';ctx.beginPath();ctx.roundRect(353,215,163,17,8);ctx.fill();ellipse(258,216,171,128,'#111518');ellipse(258,205,163,121,'#58616a');ellipse(258,198,150,108,'#22292c');ellipse(258,200,139,98,'#333c3f');if(g.oil){ellipse(260,211,130,87,'rgba(255,205,104,'+Math.min(.35,g.oil*.1)+')');for(let i=0;i<12;i++){let a=i*2.4+frame*.015;ellipse(260+Math.cos(a)*118,205+Math.sin(a)*76,2,2,'#e0a94c')}}if(g.egg){let color=g.cook>110?'#9e623c':g.cook>90?'#d7b88c':g.cook>40?'#fff2d8':'#e9edf0';ctx.beginPath();for(let i=0;i<=36;i++){let a=i*Math.PI/18,r=91+Math.sin(i*2.8)*7;let x=260+Math.cos(a)*r,y=204+Math.sin(a)*r*.73;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fillStyle=color;ctx.fill();ellipse(257,202,46,42,'#f3a93d');ellipse(249,194,26,24,'#ffd66a');ellipse(239,185,10,7,'#ffe9a6');for(let i=0;i<g.pepper*10;i++){let a=i*2.399,r=18+i*2.3;ellipse(260+Math.cos(a)*r,205+Math.sin(a)*r*.68,1.8,1.8,'#292521')}for(let i=0;i<g.salt*9;i++){let a=i*2.7,r=23+i*2;ellipse(260+Math.cos(a)*r,206+Math.sin(a)*r*.65,1.5,1.5,'#fff')}if(g.sauce){ctx.strokeStyle='#8d3c23';ctx.lineWidth=3+g.sauce;ctx.beginPath();ctx.moveTo(192,223);ctx.bezierCurveTo(225,163,280,252,325,188);ctx.stroke()}}ctx.restore()}else{ellipse(plateX,280,126,67,'#adb7ba');ellipse(plateX,272,121,62,'#f7f1e5');ellipse(plateX,272,90,44,'#d7e3e1');ellipse(plateX,272,83,38,'#faf7ed');if(flight>0){let p=Math.min(1,flight);let x=260+(aim-260)*p,y=150-92*Math.sin(Math.PI*p)+123*p;ellipse(x,y,72,46,g.cook>105?'#c6a176':'#fff1d8');ellipse(x,y,31,29,'#ffc44e');if(p>=1){flight=0;landed=true;setTimeout(finish,550)}}else if(landed){ellipse(aim,273,72,46,g.cook>105?'#c6a176':'#fff1d8');ellipse(aim,273,31,29,'#ffc44e')}ctx.strokeStyle='#f3c56d';ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(260,110);ctx.lineTo(260,345);ctx.stroke();ctx.setLineDash([]);ctx.font='12px system-ui';ctx.fillStyle='#f4e5bf';ctx.fillText('TARGET',232,100)}if(g.phase===1){let steam=g.heat===2?5:g.heat===1?3:1;for(let i=0;i<steam;i++){let x=190+i*35;ctx.strokeStyle='rgba(220,230,229,.28)';ctx.lineWidth=3;ctx.beginPath();let dy=(frame*1.5+i*30)%80;ctx.moveTo(x,138-dy);ctx.bezierCurveTo(x-14,116-dy,x+12,97-dy,x,82-dy);ctx.stroke()}}}function loop(now){let dt=Math.min(.06,(now-last)/1000||0);last=now;frame++;let g=game;if(g.started&&!g.done){if(g.phase===1){g.time+=dt;g.cook+=dt*[.82,1.55,2.9][g.heat]*(g.oil<.7?1.1:1);if(g.cook>100)g.burn+=dt*(g.cook-100)*.15;if(g.cook>150){g.cook=150;g.burn+=dt*5}if(frame%8===0)update()}if(g.phase===2){plateX+=plateDir*dt*185;if(plateX>370){plateX=370;plateDir=-1}if(plateX<150){plateX=150;plateDir=1}if(flight>0)flight+=dt*1.6}g.shakeOffset+=g.shakeVelocity;g.shakeVelocity*=.69;g.shakeOffset*=.72}draw(now);requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
